<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Scheduling Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script>window.CSC_API="https://aged-water-b6f3content-scheduling-uploader.yogeshbhade555.workers.dev";</script><script>// Runs the calendar on Cloudflare: same app, with data and files kept in the R2 bucket.

  });
  function trySign(code,adminOnly){return fetch(BASE+'/api/check',{headers:{'x-upload-key':code}}).then(function(r){return r.ok?r.json():null}).then(function(me){
    if(me&&(!adminOnly||me.role==='owner')){try{localStorage.setItem('csc.pass',code)}catch(e){}location.reload();return true}return false}).catch(function(){return false})}

  var nodb={collection:function(){return {onSnapshot:function(cb){setTimeout(function(){cb({docs:[]})},0);return function(){}}}},
    doc:function(){return {set:function(){return Promise.reject({code:'invalid_argument'})},delete:function(){return Promise.reject({code:'invalid_argument'})},onSnapshot:function(cb){setTimeout(function(){cb({exists:false,data:function(){}})},0);return function(){}}}}};

  var cache={},seen={},subs={};

  function watch(c,fn){(subs[c]=subs[c]||[]).push(fn);if(cache[c])fn();pull(c)}
  setInterval(function(){if(document.visibilityState!=='hidden')Object.keys(subs).forEach(pull)},6000);
  var db={
    collection:function(c){return {onSnapshot:function(cb){watch(c,function(){var m=cache[c]||{};cb({docs:Object.keys(m).map(function(id){return {id:id,data:function(){return m[id]}}})})});return function(){}}}},
    doc:function(path){var p=path.split('/'),c=p[0],id=p[1];return {
      set:function(data){cache[c]=Object.assign({},cache[c]||{});cache[c][id]=data;seen[c]='';fire(c);
        return api('/api/db/'+c+'/'+id,{method:'PUT',body:JSON.stringify(data)}).then(function(){}).catch(function(e){pull(c);throw e})},
      delete:function(){cache[c]=Object.assign({},cache[c]||{});delete cache[c][id];seen[c]='';fire(c);
        return api('/api/db/'+c+'/'+id,{method:'DELETE'}).then(function(){}).catch(function(e){pull(c);throw e})},

  };

  var card=null,hideT=null;
  function progress(name,done,total,state){
    if(!card){card=document.createElement('div');card.setAttribute('role','status');
      card.setAttribute('style','position:fixed;right:20px;bottom:20px;z-index:90;width:min(340px,calc(100vw - 32px));background:#fff;color:#1f1c19;border:1px solid #e6dfd3;border-radius:14px;box-shadow:0 12px 36px rgba(31,28,25,.18);padding:14px 16px;font:14px/1.4 "Hanken Grotesk",system-ui,sans-serif');
      card.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b class="n" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0"></b><b class="p" style="font-variant-numeric:tabular-nums"></b></div><div style="height:8px;background:#efe9de;border-radius:4px;overflow:hidden;margin:9px 0 7px"><i class="f" style="display:block;height:100%;width:0;background:#1f1c19;border-radius:4px;transition:width .2s"></i></div><div class="t" style="color:#6b655d;font-variant-numeric:tabular-nums"></div>';
      document.body.appendChild(card)}
    clearTimeout(hideT);card.hidden=false;

    card.querySelector('.f').style.background=state==='error'?'#c0271f':state==='done'?'#1f7a45':'#1f1c19';

  }

    return new Promise(function(res,rej){
      var x=new XMLHttpRequest();x.open('PUT',BASE+'/api/part?'+q);if(KEY)x.setRequestHeader('x-upload-key',KEY);

    upload:function(file,opt){var info,parts=[],n=Math.max(1,Math.ceil(file.size/CHUNK)),i=0,type=(opt&&opt.type)||file.type||'application/octet-stream',nm=file.name||'File';

      function next(){if(i>=n)return api('/api/complete',{method:'POST',body:JSON.stringify({key:info.key,uploadId:info.uploadId,parts:parts})});
        var base=i*CHUNK;
        return part('key='+encodeURIComponent(info.key)+'&uploadId='+encodeURIComponent(info.uploadId)+'&n='+(i+1),file.slice(base,Math.min(file.size,base+CHUNK)),4,function(l){progress(nm,Math.min(file.size,base+l),file.size)}).then(function(p){parts.push(p);i++;return next()})}

    list:function(){return api('/api/usage').then(function(u){return {assets:[],usage:u}})},

  };
  var downloads={save:function(o){var u=URL.createObjectURL(o.data instanceof Blob?o.data:new Blob([o.data])),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000);return Promise.resolve({status:'saved'})}};
  var user={can:function(){return Promise.resolve(true)},isOwner:function(){return Promise.resolve(true)},canEdit:function(){return Promise.resolve(true)},id:function(){return Promise.resolve(null)},
    me:function(){var m=window.CSC.me||{};return Promise.resolve({id:null,name:m.name||'',avatarUrl:'',email:null,isOwner:m.role==='owner',canEdit:true})}};
  var caps={db:db,assets:assets,downloads:downloads,user:user};
  window.claude={use:function(n){return ready.then(function(){if(!window.CSC.me)return n==='db'?nodb:n==='user'?{can:function(){return Promise.resolve(false)},me:user.me}:null;return caps[n]||null})}};
})();
</script>
<style>
/* Layout: left sidebar (main, workflow, settings), top bar (client switcher, search, profile), and a project page in three columns: source versions | performance and notes | edited video. Single white theme by request. */
:root{
  --bg:#f1ece2; --panel:#fbf9f5; --soft:#f6f2ea; --soft2:#efe9de; --line:#e6dfd3; --ink:#1f1c19; --muted:#6b655d;
  --blue:#1f1c19; --blue-soft:#efe9de; --ok:#1f7a45; --ok-soft:#e9f6ee; --warn:#a85a08; --warn-soft:#fff4e0; --danger:#c0271f;
  --shadow:0 1px 2px rgba(15,17,20,.05);
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
h1,h2,h3,p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{flex:none;display:block}
.meta{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);align-items:start}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--soft);border-right:1px solid var(--line);padding:18px 12px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 12px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
h1{font-size:.95rem;font-weight:700;line-height:1.2}
.slabel{font-size:.68rem;font-weight:600;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;color:var(--ink);font-weight:500}
.nv .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv .cnt{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.nv:hover{background:var(--soft2)}
.nv.on{background:#fff;box-shadow:0 1px 2px rgba(15,17,20,.1);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px}
.d-todo{background:var(--blue)} .d-reedit{background:#e08a1e} .d-scheduled{background:#9aa0aa} .d-published{background:#2f9e5b}
.storage{margin-top:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bar{height:5px;border-radius:3px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.main{min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 24px;border-bottom:1px solid var(--line)}
.field{height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px;min-width:0}
select.field{max-width:190px;font-weight:600}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0;flex:1 1 160px}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{position:relative;flex:0 1 240px}
.search .ic{position:absolute;left:10px;top:10px;color:var(--muted)}
.search input{width:100%;padding-left:32px}
.profile{display:flex;align-items:center;gap:9px}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--soft2);flex:none}
.pname{font-weight:600;line-height:1.15;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prole{border:0;background:none;padding:0;color:var(--muted);font-size:.8rem}
.content{padding:20px 24px 64px;max-width:1400px}
.notice{margin:12px 24px 0;color:var(--warn);background:var(--warn-soft);border-radius:9px;padding:9px 12px}

/* buttons */
.btn{height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:600;font-size:.88rem;color:var(--ink);text-decoration:none;white-space:nowrap;box-shadow:var(--shadow);transition:transform .08s,border-color .12s,background .12s}
.btn:hover{border-color:#c3c6cc}
.btn:active{transform:translateY(1px)}
.btn.sm{height:30px;padding:0 10px;font-size:.82rem}
.btn.wide{width:100%}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sq{width:36px;padding:0}
.btn.sm.sq{width:30px}
.btn:disabled{opacity:.5;cursor:default}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:.76rem;font-weight:600;background:var(--soft2);color:var(--muted);white-space:nowrap}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

/* cards */
.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ctitle{font-weight:700;font-size:1rem}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px 14px;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.ptitle{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}

/* project */
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:16px}
.pinfo{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:5px}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.86rem}
.pmeta span{display:inline-flex;align-items:center;gap:6px}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.15fr) minmax(0,.9fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.vnum{font-size:1.15rem;font-weight:700}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.thead{display:flex;align-items:center;gap:9px;min-width:0}
.ticon{width:32px;height:32px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.tname{font-weight:600;line-height:1.2}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.thumb{aspect-ratio:1;border-radius:7px;background:var(--soft2);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-weight:600;font-size:.82rem;border:0;padding:0;width:100%}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.instr{background:var(--soft);border-radius:8px;padding:9px 11px;color:var(--muted);font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:120px;overflow:auto}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);flex:1 1 230px;min-width:0}
.tab{border:0;background:none;padding:6px 0 9px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .kv{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.kpi .delta{font-size:.78rem;font-weight:600;color:var(--ok);margin-left:6px}
.kpi .delta.neg{color:var(--danger)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:7px;padding:5px 8px;font-size:.78rem;white-space:nowrap;transform:translate(-50%,-120%)}
.note{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0;padding-top:0}
.noteform{display:flex;gap:8px}
.noteform input{flex:1}
.preview{aspect-ratio:16/10;border-radius:10px;background:var(--soft2);overflow:hidden;display:grid;place-items:center;color:var(--muted);text-align:center;padding:0}
.preview video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.prev{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prev .pt{width:38px;height:38px;border-radius:8px;background:var(--soft2);display:grid;place-items:center;color:var(--muted);flex:none}

/* lists */
.table{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.2fr) 110px 150px 80px;gap:12px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:#fff;width:100%;text-align:left}
.trow:first-child{border-top:0}
button.trow:hover{background:var(--soft)}
.trow.th{background:var(--soft);color:var(--muted);font-size:.76rem;font-weight:600;letter-spacing:.04em}
.trow .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.bign{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.drow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px 14px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.drow:first-child{border-top:0}
.drow.today .dl{color:var(--blue);font-weight:700}
.dl{color:var(--muted);font-weight:600;font-size:.82rem}
.slot{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:3px 0;text-align:left;flex-wrap:wrap}
.slot:hover b{color:var(--blue)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:22px;width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 16px 48px rgba(15,17,20,.2)}
dialog::backdrop{background:rgba(15,17,20,.4)}
dialog h2{font-weight:700;font-size:1.15rem}
#dlgForm{display:flex;flex-direction:column;gap:13px}
#dlgForm label{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted)}
#dlgForm label.chk{flex-direction:row;align-items:center;gap:7px;color:var(--ink)}
#dlgForm input:not([type=checkbox]),#dlgForm select,#dlgForm textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;background:#fff;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dlgacts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
.err{color:var(--danger);font-size:.88rem}
.mat{display:flex;gap:8px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mat:first-child{border-top:0}
.picked{font-size:.8rem;color:var(--muted)}

.cols.two-col{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1180px){.cols.two-col .col:last-child{grid-column:auto}.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols .col:last-child{grid-column:1 / -1}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:12px 16px}
  .brand{width:100%;padding:0 0 6px}
  .slabel,.storage{display:none}
  .nv{width:auto}
  .topbar,.content{padding-inline:16px}
  .notice{margin-inline:16px}
  .cols,.grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow{grid-template-columns:minmax(0,1fr) auto}
  .trow>:nth-child(n+3){display:none}

function isGuest(){return !!(CSC&&CSC.me&&CSC.me.role==='guest')}
function isAdmin(){return CSC?!!(CSC.me&&CSC.me.role==='owner'):isOwner()}
function roleLabel(){return CSC&&CSC.me?({owner:'Admin',editor:'Editor',client:'Client'}[CSC.me.role]||'Member'):(role==='owner'?'Owner':'Editor')}
function hasLegacy(v){return okAsset(v.rawAsset)||!!safeUrl(v.rawUrl)}
function materials(v){
  const out=[];
  if(hasLegacy(v))out.push({kind:'aroll',asset:v.rawAsset,url:v.rawUrl,name:v.rawName,ver:1});
  (v.files||[]).forEach(f=>out.push(f));return out;
}
function srcN(v){return Math.max(1,v.srcVersions||1,...materials(v).map(m=>m.ver||1))}
function filesOf(v,ver,kind){const out=[];materials(v).forEach((m,i)=>{if((m.ver||1)===ver&&m.kind===kind)out.push({m,i})});return out}
function instrOf(v,ver){return (v.instr&&v.instr[ver])||(ver===1?v.notes||'':'')}
function hasEdit(v){return okAsset(v.editedAsset)||!!safeUrl(v.editedUrl)}
function isOut(v){return (v.status==='scheduled'||v.status==='published')&&hasEdit(v)}
function stageOf(v){return v.status==='published'?'published':isOut(v)?'scheduled':v.changeNote?'reedit':'todo'}
function stageBadge(v){const s=stageOf(v);return '<span class="badge '+(s==='todo'?'blue':s==='reedit'?'warn':s==='published'?'ok':'')+'">'+STAGES.find(x=>x[0]===s)[1]+'</span>'}
function approval(v){
  if(v.status==='published')return ['ok','Published'];
  if(isOut(v))return v.approved?['ok','Approved']:['blue','Ready for review'];
  if(v.changeNote)return ['warn','Changes requested'];
  return ['','Waiting for editor'];
}

/* ---------- storage ---------- */
function notice(msg){const n=$('#notice');n.textContent=msg||'';n.hidden=!msg}
function fail(e){if(e&&e.code==='invalid_argument'){canWrite=false;notice('You have view-only access to this workspace.');renderAll()}else notice('That change could not be saved. Please try again.')}
async function putVideo(id,data){
  const body=Object.assign({},data);delete body.id;
  if(db){try{await db.doc('videos/'+id).set(body)}catch(e){fail(e)}}
  else{const i=videos.findIndex(v=>v.id===id);const row=Object.assign({id},body);if(i<0)videos.push(row);else videos[i]=row;renderAll()}
}
async function patchVideo(id,patch){const v=videos.find(x=>x.id===id);if(v)await putVideo(id,Object.assign({},v,patch))}
async function delVideo(id){
  if(db){try{await db.doc('videos/'+id).delete()}catch(e){fail(e)}}
  else{videos=videos.filter(v=>v.id!==id);renderAll()}
}
async function putWs(id,data){
  if(db){try{await db.doc('workspaces/'+id).set(data)}catch(e){fail(e)}}
  else{workspaces=workspaces.filter(w=>w.id!==id).concat([Object.assign({id},data)]);renderAll()}
}
async function refreshUsage(){if(!assets)return;try{const r=await assets.list();usage=r.usage;renderSide()}catch(e){}}
async function dropAsset(id){if(assets&&okAsset(id)){try{await assets.delete(id)}catch(e){}}}
function checkFile(f,kind){
  if(f.size>MAX_BYTES)throw {msg:'“'+f.name+'” is '+fmtSize(f.size)+'. Uploads are limited to '+LIM+' each, so compress it or add it as a link instead.'};
  if(!ALLOW[kind].includes(extOf(f.name)))throw {msg:'“'+f.name+'” is not a supported file here. Use '+ALLOW[kind].filter(x=>x!=='jpeg').join(', ').toUpperCase()+'.'};
}
async function uploadOne(f,kind){
  checkFile(f,kind);
  try{const r=await assets.upload(f,{type:EXT[extOf(f.name)]});return {asset:r.id,name:f.name.slice(0,120),size:r.sizeBytes||f.size}}
  catch(e){
    const c=e&&e.code;
    throw {msg:c==='too_large'?'“'+f.name+'” is over the '+LIM+' upload limit. Compress it or add it as a link instead.':c==='unsupported_type'?'“'+f.name+'” could not be stored. If it is a text file, save it as UTF-8 and try again.':c==='quota_or_state'?'File storage for this workspace is full. Delete old files or add links instead.':'The upload did not finish. Check your connection and try again.'};
  }
}
async function uploadFiles(id,kind,ver,list){
  const fs=Array.from(list||[]);if(!fs.length||!assets)return;
  try{if(fs.length>12)throw {msg:'Upload up to 12 files at a time.'};fs.forEach(f=>checkFile(f,kind))}catch(e){return notice(e.msg)}
  const added=[];let problem='';
  for(let i=0;i<fs.length;i++){
    notice('Uploading '+KIND[kind]+' file '+(i+1)+' of '+fs.length+'. Keep this page open.');
    try{const r=await uploadOne(fs[i],kind);added.push({kind,ver,asset:r.asset,name:r.name,size:r.size,at:Date.now()})}catch(e){problem=e.msg||'The upload did not finish.';break}
  }
  const v=videos.find(x=>x.id===id);
  if(!v){for(const a of added)await dropAsset(a.asset);return notice('')}
  if(added.length)await patchVideo(id,{files:(v.files||[]).concat(added)});
  notice(problem);refreshUsage();
}
async function doDownload(v,aid,label,srcName,btn){
  if(!okAsset(aid))return;
  if(CSC&&CSC.direct){const a=document.createElement('a');a.href=(CSC.api||'')+'/_blob/'+aid+'?dl='+encodeURIComponent(fileBase(v)+'-'+label+'.'+(extOf(srcName)||'mp4'));document.body.appendChild(a);a.click();a.remove();return true}
  if(btn)btn.disabled=true;notice('Preparing the download…');
  try{
    const res=await fetch('/_blob/'+aid);if(!res.ok)throw {code:'missing'};
    const blob=await res.blob();
    if(!downloads)throw {code:'unavailable'};
    const ext=TYPE_EXT[(blob.type||'').split(';')[0]]||(EXT[extOf(srcName)]?extOf(srcName).replace('jpeg','jpg'):'mp4');
    await downloads.save({filename:fileBase(v)+'-'+label+'.'+ext,data:blob});
    notice('');if(btn)btn.disabled=false;return true;
  }catch(e){
    const c=e&&e.code;
    if(c==='missing')notice('This file is no longer stored here. Ask for it to be uploaded again.');
    else if(c==='rate_limited')notice('Another download is waiting for your answer. Finish that one first.');
    else if(c==='declined')notice('');
    else notice('The download could not start in this view. Open the workspace in a browser and try again.');
  }
  if(btn)btn.disabled=false;
}

function vCalendar(){
  const today=ymd(new Date()),end=addDays(weekStart,6),list=inClient().filter(v=>isOut(v)&&v.date);
  let rows='',n=0;
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i),key=ymd(d),items=list.filter(v=>v.date===key).sort((a,b)=>String(a.time).localeCompare(String(b.time)));n+=items.length;
    rows+='<div class="drow'+(key===today?' today':'')+'"><div class="dl">'+(key===today?'Today':DOW[i])+' '+d.getDate()+'</div><div>'+(items.length?items.map(v=>{const w=wsOf(v.ws);
      return '<button class="slot" data-act="open" data-id="'+esc(v.id)+'"><span class="meta num" style="width:70px">'+esc(niceTime(v.time))+'</span><b class="grow">'+esc(v.title)+'</b>'+(curWs==='all'&&w?'<span class="meta">'+esc(w.name)+'</span>':'')+
        (v.deliveredAt?'<span class="meta">Edit uploaded '+esc(stamp(v.deliveredAt))+'</span>':'')+stageBadge(v)+'</button>'}).join(''):'<span class="meta">—</span>')+'</div></div>';

  return '<div class="pagehead"><div><h2 class="ptitle">'+range+'</h2><p class="meta">'+(n?n+(n===1?' Instagram reel':' Instagram reels')+' this week':'Nothing scheduled this week')+'</p></div>'+

}

function thumbs(v,list,arg){
  if(!list.length)return '<div class="meta">No files yet</div>';
  let h='<div class="thumbs">';
  list.slice(0,list.length>3?2:3).forEach(({m})=>{
    const e=extOf(m.name);let inner=ic(m.url&&!okAsset(m.asset)?'link':'file',18);
    if(okAsset(m.asset)&&['png','jpg','jpeg','webp','gif'].includes(e))inner='<img src="/_blob/'+esc(m.asset)+'" alt="" loading="lazy">';
    else if(okAsset(m.asset)&&VID.includes(e))inner='<video src="/_blob/'+esc(m.asset)+'#t=0.1" preload="metadata" muted playsinline></video>';
    h+='<button class="thumb" data-act="files" data-id="'+esc(v.id)+'" data-arg="'+arg+'" aria-label="View '+esc(m.name||'file')+'">'+inner+'</button>';
  });
  if(list.length>3)h+='<button class="thumb" data-act="files" data-id="'+esc(v.id)+'" data-arg="'+arg+'">+'+(list.length-2)+'</button>';
  return h+'</div>';
}
function fileSummary(list){const n=list.length,sz=list.reduce((s,x)=>s+(x.m.size||0),0);return n?n+(n===1?' file':' files')+(sz?' · '+fmtSize(sz):''):'No files'}
const FMT={aroll:'MP4, WEBM',broll:'JPG, PNG, WEBP, GIF, MP4, WEBM',script:'PDF, TXT, MD'};
if(CSC){
  Object.assign(EXT,{mov:'video/quicktime',m4v:'video/x-m4v',mkv:'video/x-matroska',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',doc:'application/msword'});
  ['aroll','broll','edited'].forEach(k=>ALLOW[k].push('mov','m4v','mkv'));ALLOW.script.push('docx','doc');
  Object.keys(ALLOW).forEach(k=>{ACCEPT[k]=ALLOW[k].map(x=>'.'+x).join(',')});
  ['aroll','broll','script'].forEach(k=>{FMT[k]=ALLOW[k].filter(x=>x!=='jpeg').join(', ').toUpperCase()});
}
function srcTile(v,ver,kind){

function thumbInner(m){

  return ic(m.url&&!okAsset(m.asset)?'link':'file',16);

function mediaKind(m){const e=extOf(m.name);return !okAsset(m.asset)?'':VID.includes(e)?'video':['png','jpg','jpeg','webp','gif'].includes(e)?'image':''}

function chartHtml(v){
  const pts=(v.metricLog||[]).filter(p=>typeof p[metricTab]==='number'&&p.at).map(p=>({t:p.at,y:p[metricTab]}));
  const label={likes:'Likes',comments:'Comments',shares:'Shares'}[metricTab];
  if(pts.length<2)return emptyBox('chart','No trend yet','Instagram analytics is not connected. '+(isOwner()?'Update the numbers after posting and the '+label.toLowerCase()+' trend builds here.':'The trend appears once the owner has updated the numbers at least twice.'));
  const W=520,H=210,L=44,R=14,T=12,B=28,t0=pts[0].t,t1=pts[pts.length-1].t,span=Math.max(1,t1-t0);
  const max=Math.max(1,...pts.map(p=>p.y)),p10=Math.pow(10,Math.floor(Math.log10(max))),f=max/p10,top=(f<=1?1:f<=2?2:f<=5?5:10)*p10,steps=top>=4?4:top;
  const X=t=>L+(t-t0)/span*(W-L-R),Y=y=>T+(1-y/top)*(H-T-B);
  let g='';
  for(let i=0;i<=steps;i++){const val=top*i/steps,y=Y(val);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e6dfd3" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#6b655d">'+fmtK(val)+'</text>'}
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+' L'+X(t1).toFixed(1)+' '+Y(0)+' L'+X(t0).toFixed(1)+' '+Y(0)+' Z';
  const dots=pts.map((p,i)=>'<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===pts.length-1?5:4)+'" fill="#1f1c19" stroke="#fff" stroke-width="2"/>').join('');
  const xl='<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="#6b655d">'+dayOf(t0).replace(/, \d+$/,'')+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="#6b655d">'+dayOf(t1).replace(/, \d+$/,'')+'</text>';
  const data=esc(JSON.stringify(pts.map(p=>({x:X(p.t)/W,y:Y(p.y)/H,l:stamp(p.t),v:p.y.toLocaleString('en-IN')+' '+label.toLowerCase()}))));
  return '<div class="chart" data-pts="'+data+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+' over time, from '+dayOf(t0)+' to '+dayOf(t1)+'">'+g+'<path d="'+area+'" fill="#1f1c19" fill-opacity=".08"/><path d="'+line+'" fill="none" stroke="#1f1c19" stroke-width="2" stroke-linejoin="round"/>'+dots+xl+
    '<line class="cross" y1="'+T+'" y2="'+(H-B)+'" stroke="#0f1114" stroke-opacity=".25" stroke-width="1" visibility="hidden"/></svg><div class="tip" hidden></div></div>'+
    '<details><summary class="meta" style="cursor:pointer">View as table</summary><div style="margin-top:6px">'+pts.map(p=>'<div class="row meta" style="justify-content:space-between"><span>'+stamp(p.t)+'</span><span class="num" style="color:var(--ink)">'+p.y.toLocaleString('en-IN')+'</span></div>').join('')+'</div></details>';
}

function bindChart(){
  document.querySelectorAll('.chart').forEach(c=>{
    let pts=[];try{pts=JSON.parse(c.dataset.pts)}catch(e){}
    const tip=c.querySelector('.tip'),cross=c.querySelector('.cross'),svg=c.querySelector('svg');
    const move=ev=>{
      const r=svg.getBoundingClientRect(),x=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width;
      let best=pts[0];pts.forEach(p=>{if(Math.abs(p.x-x)<Math.abs(best.x-x))best=p});if(!best)return;
      tip.hidden=false;tip.textContent=best.v+' · '+best.l;tip.style.left=Math.min(Math.max(best.x*r.width,70),r.width-70)+'px';tip.style.top=(best.y*r.height)+'px';
      cross.setAttribute('x1',best.x*520);cross.setAttribute('x2',best.x*520);cross.setAttribute('visibility','visible');
    };
    const out=()=>{tip.hidden=true;cross.setAttribute('visibility','hidden')};
    svg.addEventListener('mousemove',move);svg.addEventListener('touchstart',move,{passive:true});svg.addEventListener('mouseleave',out);
  });
}

  }else if(dlgKind==='renws'){

    const title=val('f-title'),ws=val('f-ws'),notes=val('f-notes'),p=['instagram'];if($('#f-yt').checked)p.push('youtube');

document.addEventListener('click',async ev=>{
  const pk=ev.target.closest('[data-pick]');if(pk){const i=document.getElementById(pk.dataset.pick);if(i)i.click();return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id,v=id?videos.find(x=>x.id===id):null;
  if(!['delete','delver','rmaccess','delws'].includes(act)&&armedDelete)armedDelete=null;
  if(act==='nav'){if(b.dataset.view==='videos')curStage='all';go(b.dataset.view)}
  else if(act==='stage'){curStage=b.dataset.stage;go('videos')}
  else if(act==='ws'){curWs=b.dataset.ws;LS.set('csc.ws',curWs);curStage='all';go('videos')}
  else if(act==='open')go('project',id);
  else if(act==='asel'){anVideo=id;if(view!=='analytics')go('analytics');else renderAll()}
  else if(act==='week'){const d=+b.dataset.d;weekStart=d?addDays(weekStart,d):monday(new Date());renderAll()}
  else if(act==='mtab'){metricTab=b.dataset.tab;renderAll()}
  else if(act==='close')closeDlg();
  else if(['new-ws','add','deliver','resched','reedit','stats'].includes(act))openDlg(act,id);
  else if(act==='linkonly')openDlg('files',id,b.dataset.arg);
  else if(act==='files'||act==='instr'||act==='view')openDlg(act,id,b.dataset.arg);
  else if(act==='pick')pickFiles(id,b.dataset.arg);
  else if(act==='delver'&&v){
    const k=+b.dataset.arg,key='ver:'+id+':'+k,n=srcN(v);
    if(armedDelete!==key){armedDelete=key;renderAll();return}
    armedDelete=null;if(n<2)return;
    const gone=[],files=[];
    (v.files||[]).forEach(f=>{const fv=f.ver||1;if(fv===k)gone.push(f.asset);else files.push(fv>k?Object.assign({},f,{ver:fv-1}):f)});
    const instr={};for(let i=1;i<=n;i++){if(i===k)continue;const t=instrOf(v,i);if(t)instr[i>k?i-1:i]=t}
    const patch={files,instr,notes:instr[1]||'',srcVersions:n-1};
    if(k===1&&hasLegacy(v)){gone.push(v.rawAsset);Object.assign(patch,{rawAsset:'',rawUrl:'',rawName:''})}
    else if(k===1){/* nothing else to clear */}
    await patchVideo(id,patch);for(const a of gone)await dropAsset(a);refreshUsage();
  }
  else if(act==='setopen'){
    appSettings=Object.assign({},appSettings,{open:b.dataset.arg==='1'});lastHtml='';renderAll();
    if(db){try{await db.doc('settings/app').set(appSettings)}catch(x){fail(x)}}
  }
  else if(act==='accin'){
    const pw=val('accPw'),e=$('#accErr');if(!pw)return;b.disabled=true;
    const ok=CSC&&CSC.signIn?await CSC.signIn(pw):false;
    if(!ok){b.disabled=false;e.textContent='That code is not recognised.';e.hidden=false}
  }
  else if(act==='adminin'){
    const pw=val('adminPw'),e=$('#adminErr');if(!pw)return;b.disabled=true;
    const ok=CSC&&CSC.adminSignIn?await CSC.adminSignIn(pw):false;
    if(!ok){b.disabled=false;e.textContent='That password is not correct.';e.hidden=false}
  }
  else if(act==='signout'){if(CSC&&CSC.signOut)CSC.signOut()}
  else if(act==='renws')openDlg('renws',id);
  else if(act==='delws'){
    if(armedDelete!=='ws:'+id){armedDelete='ws:'+id;renderAll();return}
    armedDelete=null;if(videos.some(x=>x.ws===id))return;
    if(db){try{await db.doc('workspaces/'+id).delete()}catch(e){fail(e)}}else{workspaces=workspaces.filter(w=>w.id!==id);renderAll()}
  }
  else if(act==='addaccess'){
    const name=val('acName'),r=val('acRole'),ws=val('acWs'),e=$('#acErr');
    const bad=!name?'Enter the person’s name.':(r==='client'&&!ws)?'Choose which client this person belongs to.':'';
    if(bad){e.textContent=bad;e.hidden=false;return}
    const abc='abcdefghjkmnpqrstuvwxyz23456789',rnd=crypto.getRandomValues(new Uint8Array(12));let code='';rnd.forEach(x=>{code+=abc[x%abc.length]});
    $('#acName').value='';
    try{await db.doc('access/'+newId('a')).set({name,role:r==='client'?'client':'editor',ws,code:code.slice(0,4)+'-'+code.slice(4,8)+'-'+code.slice(8),createdAt:Date.now()})}catch(x){fail(x)}
  }
  else if(act==='rmaccess'){
    if(armedDelete!=='ac:'+id){armedDelete='ac:'+id;renderAll();return}
    armedDelete=null;try{await db.doc('access/'+id).delete()}catch(x){fail(x)}
  }
  else if(act==='copycode'){const lab=b.textContent;try{await navigator.clipboard.writeText(b.dataset.arg);b.textContent='Copied'}catch(x){b.textContent='Select and copy'}setTimeout(()=>{if(b.isConnected)b.textContent=lab},1500)}
  else if(act==='saveset'){
    const u=val('upUrl').replace(/\/+$/,''),e=$('#setErr');
    if(u&&!safeUrl(u)){e.textContent='Paste the full address, starting with https://';e.hidden=false;return}
    appSettings=Object.assign({},appSettings,{uploaderUrl:u});
    if(db){try{await db.doc('settings/app').set(appSettings)}catch(x){return fail(x)}}
    b.textContent='Saved';lastHtml='';setTimeout(renderAll,900);
  }
  else if(act==='pickedit'){const i=$('#rowPick');pickCtx={id,kind:'edited'};i.value='';i.accept=ACCEPT.edited;i.multiple=false;i.click()}
  else if(act==='dlall'&&v){
    const ver=+b.dataset.arg||1,ms=materials(v);b.disabled=true;
    for(let i=0;i<ms.length;i++){const m=ms[i];if((m.ver||1)!==ver||!okAsset(m.asset))continue;if(!(await doDownload(v,m.asset,m.kind+'-v'+ver+'-'+(i+1),m.name)))break}
    b.disabled=false;
  }
  else if(act==='deliverinline'&&v){
    const box=b.closest('.deliver'),g=c=>{const e=box.querySelector(c);return e?e.value.trim():''},err=box.querySelector('.err');
    const date=g('.edDate'),time=g('.edTime'),ed=g('.edLink'),file=pendingEdit[id];
    const say=(m,soft)=>{err.textContent=m;err.hidden=!m;err.style.color=soft?'var(--muted)':''};
    if(ed&&!safeUrl(ed))return say('Paste the full link, starting with https://');
    if(!file&&!ed)return say(assets?'Choose the edited video, or paste a link.':'Paste the edited video link.');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}/.test(time))return say('Choose a date and time.');
    let up=null;b.disabled=true;
    if(file&&assets){say('Uploading video. Keep this page open.',true);try{up=await uploadOne(file,'edited')}catch(e){b.disabled=false;return say(e.msg||'The upload did not finish.')}}
    const had=hasEdit(v),rev=v.revision||1,patch={date,time:time.slice(0,5)};
    if(had)patch.edits=(v.edits||[]).concat([{asset:v.editedAsset||'',url:v.editedUrl||'',name:v.editedName||'',size:v.editedSize||0,at:v.deliveredAt||0,editor:v.editor||'',rev}]);
    Object.assign(patch,{editedUrl:ed,editedAsset:up?up.asset:'',editedName:up?up.name:'',editedSize:up?up.size:0,editorNote:'',changeNote:'',approved:false,status:'scheduled',editor:who(),revision:had?rev+1:rev,deliveredAt:Date.now()});
    delete pendingEdit[id];const l=box.querySelector('.edLink');if(l)l.value='';
    await patchVideo(id,patch);refreshUsage();
  }
  else if(act==='newver'&&v)await patchVideo(id,{srcVersions:srcN(v)+1});
  else if(act==='approve')await patchVideo(id,{approved:true});
  else if(act==='publish')await patchVideo(id,{status:'published',approved:true,publishedAt:Date.now()});
  else if(act==='note'&&v){
    const box=b.closest('.notesbox'),i=box?box.querySelector('.noteIn'):null,text=i?i.value.trim():'';if(!text)return;i.value='';
    await patchVideo(id,{thread:(v.thread||[]).concat([{at:Date.now(),by:who(),role,text}]).slice(-100)});
  }
  else if(act==='sharev'&&v){
    const w=wsOf(v.ws),ap=approval(v),text=v.title+(w?' ('+w.name+')':'')+'\nStatus: '+ap[1]+(isOut(v)?'\nInstagram: '+niceDate(v.date)+', '+niceTime(v.time):'')+(safeUrl(v.editedUrl)?'\nEdited video: '+v.editedUrl:'');
    const lab=b.innerHTML;try{await navigator.clipboard.writeText(text);b.textContent='Copied'}catch(e){b.textContent='Copy not available here'}
    setTimeout(()=>{if(b.isConnected)b.innerHTML=lab},1600);
  }
  else if(act==='addlink'&&v){
    const u=val('f-link'),[k,vs]=String(b.dataset.arg).split(':');if(!safeUrl(u))return formErr('Paste the full link, starting with https://');
    await patchVideo(id,{files:(v.files||[]).concat([{kind:k,ver:+vs||1,url:u,at:Date.now()}])});
  }
  else if(act==='rmfile'&&v){
    const fi=+b.dataset.fi,off=hasLegacy(v)?1:0;
    if(fi<off){const a=v.rawAsset;await patchVideo(id,{rawAsset:'',rawUrl:'',rawName:''});await dropAsset(a)}
    else{const files=(v.files||[]).slice(),gone=files.splice(fi-off,1)[0];await patchVideo(id,{files});if(gone)await dropAsset(gone.asset)}
    refreshUsage();
  }
  else if(act==='delete'){
    if(armedDelete===id){armedDelete=null;if(view==='project')go('videos');await delVideo(id);if(v){await dropAsset(v.rawAsset);await dropAsset(v.editedAsset);for(const f of (v.files||[]))await dropAsset(f.asset);for(const e of (v.edits||[]))await dropAsset(e.asset);refreshUsage()}}
    else{armedDelete=id;renderAll()}
  }
  else if(act==='dl'&&v){
    const fi=b.dataset.fi;
    if(fi!=null){const m=materials(v)[+fi];if(m)await doDownload(v,m.asset,m.kind+'-v'+(m.ver||1)+'-'+(+fi+1),m.name,b)}
    else await doDownload(v,v.editedAsset,'edited-v'+(v.revision||1),v.editedName,b);
  }
  else if(act==='dlprev'&&v){const p=(v.edits||[])[+b.dataset.fi];if(p)await doDownload(v,p.asset,'edited-v'+(p.rev||''),p.name,b)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='stageSel'){curStage=t.value;renderAll()}
  else if((t.id==='roleSel'||t.id==='roleSel2')&&(!CSC||isGuest()||isAdmin())){role=t.value;LS.set('csc.role',role);renderAll()}
  else if(t.id==='wsSel'){curWs=t.value;LS.set('csc.ws',curWs);if(view==='project')go('videos');else renderAll()}
  else if(t.type==='file'&&t.id!=='rowPick'){const s=document.getElementById('p-'+t.id);if(s)s.textContent=t.files&&t.files[0]?t.files[0].name:'No file chosen'}
});
document.addEventListener('input',e=>{
  if(e.target.id==='edName'){edName=e.target.value.trim();LS.set('csc.name',edName);$('#pname').textContent=who()}
  else if(e.target.id==='q'){q=e.target.value.trim();if(view!=='videos'){curStage='all';go('videos')}else renderAll()}
});
document.addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('scriptIn')){
    e.preventDefault();const t=e.target,text=t.value.trim(),ver=+t.dataset.ver||1,v=videos.find(x=>x.id===t.dataset.id);if(!text||!v)return;
    await patchVideo(v.id,Object.assign({instr:Object.assign({},v.instr||{},{[ver]:text})},ver===1?{notes:text}:{}));return;
  }
});
['dragover','dragleave','drop'].forEach(type=>document.addEventListener(type,async e=>{
  const z=e.target.closest&&e.target.closest('[data-dz]');if(!z)return;
  e.preventDefault();z.classList.toggle('over',type==='dragover');
  if(type==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){const [id,arg]=z.dataset.dz.split('|'),[k,vs]=arg.split(':');if(k==='edited')stageEdit(id,e.dataTransfer.files[0]);else await uploadFiles(id,k,+vs||1,e.dataTransfer.files)}
}));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='adminPw'||e.target.id==='accPw')){e.preventDefault();const b=document.querySelector(e.target.id==='adminPw'?'[data-act="adminin"]':'[data-act="accin"]');if(b)b.click();return}const t=e.target;if(e.key==='Enter'&&!e.shiftKey&&t.classList&&t.classList.contains('noteIn')){e.preventDefault();const b=t.closest('.notesbox').querySelector('[data-act="note"]');if(b)b.click()}});
function stageEdit(id,f){try{checkFile(f,'edited')}catch(e){return notice(e.msg)}notice('');pendingEdit[id]=f;lastHtml='';renderAll()}
$('#rowPick').addEventListener('change',async e=>{const c=pickCtx,list=Array.from(e.target.files||[]);pickCtx=null;if(!c||!list.length)return;if(c.kind==='edited')stageEdit(c.id,list[0]);else await uploadFiles(c.id,c.kind,c.ver,list)});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDlg()});
window.addEventListener('hashchange',()=>{readHash();renderAll()});

/* ---------- boot ---------- */
readHash();if(!role)role='owner';renderAll();
(async function(){
  const c=window.claude;
  if(c&&c.use){
    try{
      db=await c.use('db');
      try{assets=await c.use('assets')}catch(e){assets=null}
      try{downloads=await c.use('downloads')}catch(e){downloads=null}
      const user=await c.use('user');
      if(user){
        const w=await user.can('data.write');if(w===false){canWrite=false;if(!CSC)notice('You have view-only access to this workspace.')}
        if(CSC&&CSC.me&&CSC.me.role!=='guest'&&CSC.me.role!=='owner'){role=CSC.me.role==='editor'?'editor':'owner';if(CSC.me.ws){curWs=CSC.me.ws}}
        try{const me=await user.me();profileName=me.name||'';if(me.avatarUrl){const a=$('#avatar');a.src=me.avatarUrl;a.hidden=false}
          if(!CSC&&!LS.get('csc.role','')){role=me.isOwner?'owner':'editor'}}catch(e){}
      }
    }catch(e){db=null}
  }
  if(!db){wsLoaded=vidLoaded=true;notice('Saving is not available in this view, so changes stay on this screen only. Sign in to Claude to save and share them.');renderAll();return}
  renderAll();refreshUsage();
  const onErr=()=>notice('The live connection stopped. Reload the page to reconnect.');
  db.collection('workspaces').onSnapshot(s=>{workspaces=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));wsLoaded=true;renderAll()},onErr);
  if(CSC&&isAdmin())db.collection('access').onSnapshot(s=>{access=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));renderAll()},()=>{});
  db.doc('settings/app').onSnapshot(d=>{appSettings=d.exists?Object.assign({},d.data()):{};renderAll()},()=>{});
  db.collection('videos').onSnapshot(s=>{videos=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));vidLoaded=true;renderAll()},onErr);
})();
})();
</script>
</body></html>
