<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script>window.CSC_API="https://aged-water-b6f3content-scheduling-uploader.yogeshbhade555.workers.dev";</script><script>// Runs the calendar on Cloudflare: same app, with data and files kept in the R2 bucket.

  window.CSC.joinInfo=function(code){return fetch(BASE+'/api/join-info?code='+encodeURIComponent(code)).then(function(r){return r.ok?r.json():null},function(){return null})};

    card.querySelector('.n').textContent=name||'File';
    card.querySelector('.p').textContent=state==='error'?'Stopped':state==='done'?'Done':pct+'%';
    card.querySelector('.f').style.width=(state==='done'?100:pct)+'%';
    card.querySelector('.f').style.background=state==='error'?'#c0271f':state==='done'?'#1f7a45':'#1f1c19';
    card.querySelector('.t').textContent=state==='error'?'The upload did not finish.':state==='done'?size(total)+' uploaded':size(done)+' of '+size(total)+' uploaded. Keep this page open.';

<style>
/* Layout: left sidebar (main, workflow, settings), top bar (client switcher, search, profile), and a project page in three columns: source versions | performance and notes | edited video. Single white theme by request. */
:root{
  --bg:#f1ece2; --panel:#fbf9f5; --soft:#f6f2ea; --soft2:#efe9de; --line:#e6dfd3; --ink:#1f1c19; --muted:#6b655d;
  --blue:#1f1c19; --blue-soft:#efe9de; --ok:#1f7a45; --ok-soft:#e9f6ee; --warn:#a85a08; --warn-soft:#fff4e0; --danger:#c0271f;
  --shadow:0 1px 2px rgba(15,17,20,.05);
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}

.phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:16px}

function checkFile(f,kind){
  if(f.size>MAX_BYTES)throw {msg:'“'+f.name+'” is '+fmtSize(f.size)+'. Uploads are limited to '+LIM+' each, so compress it or add it as a link instead.'};
  if(!ALLOW[kind].includes(extOf(f.name)))throw {msg:'“'+f.name+'” is not a supported file here. Use '+ALLOW[kind].filter(x=>x!=='jpeg').join(', ').toUpperCase()+'.'};
}
async function uploadOne(f,kind){
  checkFile(f,kind);
  try{const r=await assets.upload(f,{type:EXT[extOf(f.name)]});return {asset:r.id,name:f.name.slice(0,120),size:r.sizeBytes||f.size}}
  catch(e){
    const c=e&&e.code;
    throw {msg:c==='too_large'?'“'+f.name+'” is over the '+LIM+' upload limit. Compress it or add it as a link instead.':c==='unsupported_type'?'“'+f.name+'” could not be stored. If it is a text file, save it as UTF-8 and try again.':c==='quota_or_state'?'File storage for this workspace is full. Delete old files or add links instead.':'The upload did not finish. Check your connection and try again.'};
  }
}
async function uploadFiles(id,kind,ver,list){
  const fs=Array.from(list||[]);if(!fs.length||!assets)return;
  try{if(fs.length>12)throw {msg:'Upload up to 12 files at a time.'};fs.forEach(f=>checkFile(f,kind))}catch(e){return notice(e.msg)}
  const added=[];let problem='';
  for(let i=0;i<fs.length;i++){
    notice('Uploading '+KIND[kind]+' file '+(i+1)+' of '+fs.length+'. Keep this page open.');
    try{const r=await uploadOne(fs[i],kind);added.push({kind,ver,asset:r.asset,name:r.name,size:r.size,at:Date.now()})}catch(e){problem=e.msg||'The upload did not finish.';break}
  }
  const v=videos.find(x=>x.id===id);
  if(!v){for(const a of added)await dropAsset(a.asset);return notice('')}
  if(added.length)await patchVideo(id,{files:(v.files||[]).concat(added)});
  notice(problem);refreshUsage();
}
async function doDownload(v,aid,label,srcName,btn){
  if(!okAsset(aid))return;
  if(CSC&&CSC.direct){const a=document.createElement('a');a.href=(CSC.api||'')+'/_blob/'+aid+'?dl='+encodeURIComponent(fileBase(v)+'-'+label+'.'+(extOf(srcName)||'mp4'));document.body.appendChild(a);a.click();a.remove();return true}
  if(btn)btn.disabled=true;notice('Preparing the download…');
  try{
    const res=await fetch('/_blob/'+aid);if(!res.ok)throw {code:'missing'};
    const blob=await res.blob();
    if(!downloads)throw {code:'unavailable'};
    const ext=TYPE_EXT[(blob.type||'').split(';')[0]]||(EXT[extOf(srcName)]?extOf(srcName).replace('jpeg','jpg'):'mp4');
    await downloads.save({filename:fileBase(v)+'-'+label+'.'+ext,data:blob});
    notice('');if(btn)btn.disabled=false;return true;
  }catch(e){
    const c=e&&e.code;
    if(c==='missing')notice('This file is no longer stored here. Ask for it to be uploaded again.');
    else if(c==='rate_limited')notice('Another download is waiting for your answer. Finish that one first.');
    else if(c==='declined')notice('');
    else notice('The download could not start in this view. Open the workspace in a browser and try again.');
  }
  if(btn)btn.disabled=false;
}

    '<details><summary class="meta" style="cursor:pointer">View as table</summary><div style="margin-top:6px">'+pts.map(p=>'<div class="row meta" style="justify-content:space-between"><span>'+stamp(p.t)+'</span><span class="num" style="color:var(--ink)">'+p.y.toLocaleString('en-IN')+'</span></div>').join('')+'</div></details>';

const igPosts={};let igPostTimer=0;
function loadPosts(ws,force){
  if(!CSC||!CSC.ig||!ws)return;const c=igPosts[ws];

  igPosts[ws]=Object.assign({},c||{list:[]},{loading:true,at:Date.now()});
  CSC.ig.posts(ws).then(r=>{igPosts[ws]={list:r.posts||[],at:Date.now()};renderAll();igPollPosts()},()=>{igPosts[ws]=Object.assign({},igPosts[ws],{loading:false})});

function igPollPosts(){
  clearTimeout(igPostTimer);
  const busy=[];Object.keys(igPosts).forEach(ws=>(igPosts[ws].list||[]).forEach(p=>{if(p.status==='processing'||(p.status==='queued'&&p.at<=Date.now()))busy.push([ws,p.id])}));
  if(!busy.length)return;
  igPostTimer=setTimeout(async()=>{for(const [ws,id] of busy){try{await CSC.ig.step(ws,id)}catch(e){}}Object.keys(igPosts).forEach(ws=>loadPosts(ws,true))},20000);

function bindChart(){
  document.querySelectorAll('.chart').forEach(c=>{
    let pts=[];try{pts=JSON.parse(c.dataset.pts)}catch(e){}
    const tip=c.querySelector('.tip'),cross=c.querySelector('.cross'),svg=c.querySelector('svg');
    const move=ev=>{
      const r=svg.getBoundingClientRect(),x=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width;
      let best=pts[0];pts.forEach(p=>{if(Math.abs(p.x-x)<Math.abs(best.x-x))best=p});if(!best)return;
      tip.hidden=false;tip.textContent=best.v+' · '+best.l;tip.style.left=Math.min(Math.max(best.x*r.width,70),r.width-70)+'px';tip.style.top=(best.y*r.height)+'px';
      cross.setAttribute('x1',best.x*520);cross.setAttribute('x2',best.x*520);cross.setAttribute('visibility','visible');
    };
    const out=()=>{tip.hidden=true;cross.setAttribute('visibility','hidden')};
    svg.addEventListener('mousemove',move);svg.addEventListener('touchstart',move,{passive:true});svg.addEventListener('mouseleave',out);
  });
}

      '<label>Shares<input id="f-shares" type="number" min="0" step="1" inputmode="numeric" value="'+n(v.shares)+'"></label></div>'+acts('Save');
  }else if((kind==='deliver'||kind==='resched')&&v){
    const d=v.date||ymd(addDays(new Date(),1)),t=v.time||'18:00';
    h='<h2>'+(kind==='resched'?'Change date and time':hasEdit(v)?'Upload new version':'Upload edited video')+'</h2><p class="meta">'+esc(v.title)+'</p>'+
      (kind==='deliver'&&v.changeNote?'<p class="meta" style="color:var(--warn)">Changes requested: '+esc(v.changeNote)+'</p>':'');
    if(kind==='deliver'){
      if(assets)h+='<div><button type="button" class="btn wide" data-pick="f-editedfile">'+ic('up')+'Choose video (up to '+LIM+')</button><div class="picked" id="p-f-editedfile">No file chosen</div><input hidden id="f-editedfile" type="file" aria-label="Edited video file" accept="'+ACCEPT.edited+'"></div>';
      h+='<label>'+(assets?'Or paste a link for larger files':'Edited video link')+'<input id="f-edited" type="url" placeholder="https://drive.google.com/…"></label>';

      (kind==='deliver'?'<label>Note for the owner (optional)<input id="f-note" maxlength="200" placeholder="e.g. Used the second take, 42 seconds"></label>':'')+

    const dt=v.date?parseYmd(v.date):null;if(dt&&v.time){const t=v.time.split(':');dt.setHours(+t[0],+t[1],0,0)}else if(dt)dt.setHours(18,0,0,0);

      '<label class="chk"><input id="f-feed" type="checkbox" checked> Also show it in the main feed, not only in Reels</label>'+
      (future?'<div class="two"><button type="submit" class="btn" data-arg="sched">'+ic('cal')+'Schedule for '+esc(niceDate(v.date)+(v.time?', '+niceTime(v.time):', 6:00 PM'))+'</button><button type="submit" class="btn dark" data-arg="now">'+ic('insta')+'Post now</button></div>':'<button type="submit" class="btn dark wide" data-arg="now">'+ic('insta')+'Post now</button>')+
      '<p class="meta">Reels up to 300 MB, between 3 seconds and 15 minutes. Scheduled posts go out at that time even if nobody has the site open.</p><p class="err" id="f-err" hidden></p><div class="dlgacts"><button type="button" class="btn" data-act="close">Cancel</button></div>';

function closeDlg(){const d=$('#dlg');players.forEach(P=>{if(d.contains(P.root))P.destroy()});if(d.open)d.close();dlgKind=null;dlgId=null;dlgArg=null}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function formErr(m){const e=$('#f-err');if(e){e.textContent=m;e.hidden=false;e.style.color=''}const b=$('#dlgForm button[type=submit]');if(b)b.disabled=false}
function busy(msg){const e=$('#f-err');if(e){e.textContent=msg;e.hidden=false;e.style.color='var(--muted)'}const b=$('#dlgForm button[type=submit]');if(b)b.disabled=true}
function pickFiles(id,arg){

$('#dlgForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(dlgKind==='new-ws'){
    const name=val('f-name');if(!name)return formErr(isClient()?'Enter a name for the project.':'Enter a name for the client.');
    if(CSC&&isClient()){busy('Creating…');try{const r=await CSC.project(name);LS.set('csc.ws',r.id);location.hash='#videos';location.reload()}catch(x){formErr(x.message||'The project could not be created.')}return}
    const id=newId('w');await putWs(id,{name,createdAt:Date.now()});
    curWs=id;LS.set('csc.ws',id);closeDlg();renderAll();
  }else if(dlgKind==='igpost'){
    const v=videos.find(x=>x.id===dlgId);if(!v)return closeDlg();
    const sub=ev&&ev.submitter,sched=sub&&sub.dataset.arg==='sched',cap=($('#f-caption')||{}).value||'';
    busy(sched?'Scheduling…':'Sending the video to Instagram…');
    try{await patchVideo(v.id,{caption:cap.slice(0,2200)});const r=await CSC.ig.publish({ws:v.ws,vid:v.id,caption:cap,feed:$('#f-feed').checked,at:sched?dlgArg:0});closeDlg();notice(sched?'Scheduled. It will post to Instagram at that time.':'Sent to Instagram. It appears on the account once Instagram finishes processing, usually within a few minutes.');loadPosts(v.ws,true)}
    catch(x){formErr(x.message||'Instagram did not accept the post.')}
  }else if(dlgKind==='renws'){
    const name=val('f-name'),w=wsOf(dlgId);if(!name)return formErr('Enter a name for the client.');
    closeDlg();if(w){const d=Object.assign({},w,{name});delete d.id;await putWs(w.id,d)}
  }else if(dlgKind==='add'){
    const title=val('f-title'),ws=val('f-ws'),notes=val('f-notes'),p=['instagram'];if($('#f-yt').checked)p.push('youtube');
    if(!title)return formErr('Give the video a title.');
    if(!ws)return formErr('Choose a client.');
    const id=newId('v');closeDlg();await putVideo(id,{ws,title,files:[],platforms:p,notes,status:'raw',revision:1,srcVersions:1,createdAt:Date.now()});go('project',id);
  }else if(dlgKind==='instr'){
    const id=dlgId,ver=+dlgArg||1,v=videos.find(x=>x.id===id),text=val('f-instr');
    closeDlg();if(v)await patchVideo(id,Object.assign({instr:Object.assign({},v.instr||{},{[ver]:text})},ver===1?{notes:text}:{}));
  }else if(dlgKind==='stats'){
    const id=dlgId,v=videos.find(x=>x.id===id),patch={};
    for(const k of ['likes','comments','shares']){
      const raw=val('f-'+k);if(raw===''){patch[k]=null;continue}
      const n=Number(raw);if(!Number.isFinite(n)||n<0||Math.floor(n)!==n)return formErr('Enter whole numbers, 0 or more.');
      patch[k]=n;
    }
    closeDlg();if(v){patch.metricLog=(v.metricLog||[]).concat([{at:Date.now(),likes:patch.likes,comments:patch.comments,shares:patch.shares}]).slice(-90);await patchVideo(id,patch)}
  }else if(dlgKind==='reedit'){
    const note=val('f-change'),id=dlgId;
    if(!note)return formErr('Tell the editor what should change.');
    closeDlg();await patchVideo(id,{status:'editing',changeNote:note,approved:false});
  }else if(dlgKind==='deliver'||dlgKind==='resched'){
    const date=val('f-date'),time=val('f-time'),id=dlgId,v=videos.find(x=>x.id===id);
    if(!v)return closeDlg();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}/.test(time))return formErr('Choose a date and time.');
    const patch={date,time:time.slice(0,5)};
    if(dlgKind==='deliver'){
      const ed=val('f-edited'),note=val('f-note'),ef=document.getElementById('f-editedfile'),file=ef&&ef.files&&ef.files[0];
      if(ed&&!safeUrl(ed))return formErr('Paste the full link, starting with https://');
      if(!file&&!ed)return formErr(assets?'Choose the edited video to upload, or paste a link.':'Paste the full edited video link, starting with https://');
      let up=null;
      if(file&&assets){busy('Uploading video. Keep this window open.');try{up=await uploadOne(file,'edited')}catch(e){return formErr(e.msg||'The upload did not finish.')}}
      const had=hasEdit(v),rev=v.revision||1;
      if(had)patch.edits=(v.edits||[]).concat([{asset:v.editedAsset||'',url:v.editedUrl||'',name:v.editedName||'',size:v.editedSize||0,at:v.deliveredAt||0,editor:v.editor||'',rev}]);
      Object.assign(patch,{editedUrl:ed,editedAsset:up?up.asset:'',editedName:up?up.name:'',editedSize:up?up.size:0,editorNote:note,changeNote:'',approved:false,status:'scheduled',editor:who(),revision:had?rev+1:rev,deliveredAt:Date.now()});
    }
    closeDlg();weekStart=monday(parseYmd(date));await patchVideo(id,patch);refreshUsage();renderAll();
  }
});

document.addEventListener('click',async ev=>{

  const b=ev.target.closest('[data-act]');if(!b)return;

  if(!['delete','delver','rmaccess','delws','newlink','pplrm','newjoin','newinvite','delinspo','igoff'].includes(act)&&armedDelete)armedDelete=null;
  if(act==='menu'){const sd=$('#side'),o=!sd.classList.contains('open');sd.classList.toggle('open',o);b.setAttribute('aria-expanded',String(o));return}

  else if(act==='stage'){curStage=b.dataset.stage;go('videos')}

  else if(act==='ws'){curWs=b.dataset.ws;LS.set('csc.ws',curWs);curStage='all';go('videos')}

  else if(act==='mtab'){metricTab=b.dataset.tab;renderAll()}

    const instr={};for(let i=1;i<=n;i++){if(i===k)continue;const t=instrOf(v,i);if(t)instr[i>k?i-1:i]=t}
    const patch={files,instr,notes:instr[1]||'',srcVersions:n-1};
    if(k===1&&hasLegacy(v)){gone.push(v.rawAsset);Object.assign(patch,{rawAsset:'',rawUrl:'',rawName:''})}
    else if(k===1){/* nothing else to clear */}
    await patchVideo(id,patch);for(const a of gone)await dropAsset(a);refreshUsage();
  }
  else if(act==='setopen'){

    if(db){try{await db.doc('settings/app').set(appSettings)}catch(x){fail(x)}}
  }
  else if(act==='authmode'||act==='authrole'){

    if(act==='authmode')authMode=b.dataset.arg;else authRole=b.dataset.arg;renderAll();
  }
  else if(act==='authgo'){

    if(!email||!pw)return say('Enter your email and password.');
    b.disabled=true;e.hidden=true;
    try{if(authMode==='signup')await CSC.signup(CSC.join?{email,password:pw,join:CSC.join}:{email,password:pw});else await CSC.login(email,pw)}catch(x){say(x.message||'That did not work. Try again.')}
  }
  else if(act==='playpv'){stopPreviews();const box=b.closest('.pv,.preview'),d=document.createElement('div');b.hidden=true;box.insertBefore(d,box.firstChild);mountPlayer(d,b.dataset.asset,true)}

  else if(act==='publish')await patchVideo(id,{status:'published',approved:true,publishedAt:Date.now()});
  else if(act==='note'&&v){
    const box=b.closest('.notesbox'),i=box?box.querySelector('.noteIn'):null,text=i?i.value.trim():'';if(!text)return;i.value='';
    await patchVideo(id,{thread:(v.thread||[]).concat([{at:Date.now(),by:who(),role,text}]).slice(-100)});
  }
  else if(act==='sharev'&&v){
    const w=wsOf(v.ws),ap=approval(v),text=v.title+(w?' ('+w.name+')':'')+'\nStatus: '+ap[1]+(isOut(v)?'\nInstagram: '+whenOf(v):'')+(safeUrl(v.editedUrl)?'\nEdited video: '+v.editedUrl:'');
    const lab=b.innerHTML;try{await navigator.clipboard.writeText(text);b.textContent='Copied'}catch(e){b.textContent='Copy not available here'}
    setTimeout(()=>{if(b.isConnected)b.innerHTML=lab},1600);
  }
  else if(act==='addlink'&&v){
    const u=val('f-link'),[k,vs]=String(b.dataset.arg).split(':');if(!safeUrl(u))return formErr('Paste the full link, starting with https://');
    await patchVideo(id,{files:(v.files||[]).concat([{kind:k,ver:+vs||1,url:u,at:Date.now()}])});
  }
  else if(act==='rmfile'&&v){
    const fi=+b.dataset.fi,off=hasLegacy(v)?1:0;
    if(fi<off){const a=v.rawAsset;await patchVideo(id,{rawAsset:'',rawUrl:'',rawName:''});await dropAsset(a)}
    else{const files=(v.files||[]).slice(),gone=files.splice(fi-off,1)[0];await patchVideo(id,{files});if(gone)await dropAsset(gone.asset)}
    refreshUsage();
  }
  else if(act==='delete'){
    if(armedDelete===id){armedDelete=null;if(view==='project')go('videos');await delVideo(id);if(v){await dropAsset(v.rawAsset);await dropAsset(v.editedAsset);for(const f of (v.files||[]))await dropAsset(f.asset);for(const e of (v.edits||[]))await dropAsset(e.asset);refreshUsage()}}
    else{armedDelete=id;renderAll()}
  }
  else if(act==='dl'&&v){
    const fi=b.dataset.fi;
    if(fi!=null){const m=materials(v)[+fi];if(m)await doDownload(v,m.asset,m.kind+'-v'+(m.ver||1)+'-'+(+fi+1),m.name,b)}
    else await doDownload(v,v.editedAsset,'edited-v'+(v.revision||1),v.editedName,b);
  }
  else if(act==='dlprev'&&v){const p=(v.edits||[])[+b.dataset.fi];if(p)await doDownload(v,p.asset,'edited-v'+(p.rev||''),p.name,b)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='stageSel'){curStage=t.value;renderAll()}
  else if((t.id==='roleSel'||t.id==='roleSel2')&&(!CSC||isGuest()||isAdmin())){role=t.value;LS.set('csc.role',role);renderAll()}
  else if(t.id==='igSort'){igSort=t.value;renderAll()}
  else if(t.id==='igType'){igType=t.value;igShow=30;renderAll()}
  else if(t.id==='wsSel'){curWs=t.value;LS.set('csc.ws',curWs);if(view==='project')go('videos');else renderAll()}
  else if(t.type==='file'&&t.id!=='rowPick'){const s=document.getElementById('p-'+t.id);if(s)s.textContent=t.files&&t.files[0]?t.files[0].name:'No file chosen'}
});
document.addEventListener('input',e=>{
  if(e.target.id==='edName'){edName=e.target.value.trim();LS.set('csc.name',edName);$('#pname').textContent=who()}
  else if(e.target.id==='q'){q=e.target.value.trim();if(view!=='videos'){curStage='all';go('videos')}else renderAll()}
});
document.addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('scriptIn')){
    e.preventDefault();const t=e.target,text=t.value.trim(),ver=+t.dataset.ver||1,v=videos.find(x=>x.id===t.dataset.id);if(!text||!v)return;
    await patchVideo(v.id,Object.assign({instr:Object.assign({},v.instr||{},{[ver]:text})},ver===1?{notes:text}:{}));return;
  }
});
['dragover','dragleave','drop'].forEach(type=>document.addEventListener(type,async e=>{
  const z=e.target.closest&&e.target.closest('[data-dz]');if(!z)return;
  e.preventDefault();z.classList.toggle('over',type==='dragover');
  if(type==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){const [id,arg]=z.dataset.dz.split('|'),[k,vs]=arg.split(':');if(k==='edited')stageEdit(id,e.dataTransfer.files[0]);else await uploadFiles(id,k,+vs||1,e.dataTransfer.files)}
}));
document.addEventListener('loadedmetadata',e=>{const t=e.target,p=t.closest&&t.closest('.pv');if(p&&t.tagName==='VIDEO'){p.classList.toggle('tall',t.videoHeight>t.videoWidth);if(!t.videoWidth)p.classList.add('bad')}},true);
document.addEventListener('error',e=>{const t=e.target,p=t&&t.tagName==='VIDEO'&&t.closest('.pv');if(p)p.classList.add('bad')},true);
document.addEventListener('timeupdate',e=>{const t=e.target,p=t&&t.tagName==='VIDEO'&&t.closest&&t.closest('.pv,.fullpv');if(!p||t.paused||t.currentTime<0.6||p.classList.contains('nopic'))return;let n=1;try{n=t.getVideoPlaybackQuality?t.getVideoPlaybackQuality().totalVideoFrames:(t.webkitDecodedFrameCount==null?1:t.webkitDecodedFrameCount)}catch(x){}if(n===0)p.classList.add('nopic')},true);
document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('pplWs')&&CSC)CSC.userUpdate({id:t.dataset.id,ws:t.value}).then(loadPeople,pplErr)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&/^in(Url|Note)$/.test(e.target.id||'')){e.preventDefault();const b=document.querySelector('[data-act="addinspo"]');if(b)b.click();return}if(e.key==='Enter'&&/^auth(Name|Brand|Email|Pw)$/.test(e.target.id||'')){e.preventDefault();const b=document.querySelector('[data-act="authgo"]');if(b)b.click();return}if(e.key==='Enter'&&(e.target.id==='adminPw'||e.target.id==='accPw')){e.preventDefault();const b=document.querySelector(e.target.id==='adminPw'?'[data-act="adminin"]':'[data-act="accin"]');if(b)b.click();return}const t=e.target;if(e.key==='Enter'&&!e.shiftKey&&t.classList&&t.classList.contains('noteIn')){e.preventDefault();const b=t.closest('.notesbox').querySelector('[data-act="note"]');if(b)b.click()}});
function stageEdit(id,f){try{checkFile(f,'edited')}catch(e){return notice(e.msg)}notice('');pendingEdit[id]=f;lastHtml='';renderAll()}
$('#rowPick').addEventListener('change',async e=>{const c=pickCtx,list=Array.from(e.target.files||[]);pickCtx=null;if(!c||!list.length)return;if(c.kind==='edited')stageEdit(c.id,list[0]);else await uploadFiles(c.id,c.kind,c.ver,list)});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDlg()});
function autoJoin(jc){
  const had=(CSC.me.wss||[]).slice();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  CSC.joinProject(jc).then(r=>{if(!had.length||had.includes(r.ws)){if(had.includes(r.ws)){curWs=r.ws;LS.set('csc.ws',r.ws);go('videos')}return}LS.set('csc.ws',r.ws);notice('You joined '+r.name+'. It is now in your Workspaces.');try{history.replaceState(null,'',location.pathname+'#clients')}catch(e){}setTimeout(()=>location.reload(),1200)},x=>notice(x.message||'That invite link did not work.'));
}
window.addEventListener('hashchange',()=>{const m=/^#join=(e_[0-9a-z_]{10,60})$/.exec(location.hash);if(m&&CSC&&CSC.me&&CSC.me.role==='editor'){autoJoin(m[1]);return}readHash();renderAll()});

/* ---------- boot ---------- */
readHash();if(!role)role='owner';renderAll();
try{const qm=new URLSearchParams(location.search).get('ig');if(qm){notice(qm);history.replaceState(null,'',location.pathname+location.hash)}}catch(e){}
(async function(){
  const c=window.claude;
  if(c&&c.use){
    try{
      db=await c.use('db');
      try{assets=await c.use('assets')}catch(e){assets=null}
      try{downloads=await c.use('downloads')}catch(e){downloads=null}
      const user=await c.use('user');
      if(user){
        const w=await user.can('data.write');if(w===false){canWrite=false;if(!CSC)notice('You have view-only access to this workspace.')}
        if(CSC&&CSC.me&&CSC.me.role==='owner')role='owner';
        if(CSC&&CSC.me&&CSC.me.role!=='pending'&&(CSC.me.wss||[]).length!==1&&!/^#(v-|[a-z]+$)/.test(location.hash||'')){view='clients'}
        if(CSC&&CSC.me&&CSC.me.role!=='guest'&&CSC.me.role!=='owner'){role=CSC.me.role==='editor'?'editor':'owner';const L=CSC.me.wss||[];if(L.length&&!L.includes(curWs))curWs=L.length===1?L[0]:'all'}
        try{const me=await user.me();profileName=me.name||'';if(me.avatarUrl){const a=$('#avatar');a.src=me.avatarUrl;a.hidden=false}
          if(!CSC&&!LS.get('csc.role','')){role=me.isOwner?'owner':'editor'}}catch(e){}
      }
    }catch(e){db=null}
  }
  if(!db){wsLoaded=vidLoaded=true;notice('Saving is not available in this view, so changes stay on this screen only. Sign in to Claude to save and share them.');renderAll();return}
  renderAll();refreshUsage();
  const onErr=()=>notice('The live connection stopped. Reload the page to reconnect.');
  if(CSC&&CSC.join&&CSC.me&&CSC.me.role==='editor'&&/^e_/.test(CSC.join)){const jc=CSC.join;CSC.join='';autoJoin(jc)}
  if(CSC&&CSC.join&&!CSC.me){authMode='signup';CSC.joinInfo(CSC.join).then(j=>{joinName=j?j.name:'';joinAuto=!!(j&&j.auto);joinBad=!j;renderAll()})}
  loadPeople();setInterval(()=>{if(view==='admin'&&!document.hidden)loadPeople()},20000);
  db.collection('workspaces').onSnapshot(s=>{workspaces=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));wsLoaded=true;renderAll()},onErr);
  if(CSC&&isAdmin())db.collection('access').onSnapshot(s=>{access=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));renderAll()},()=>{});
  db.doc('settings/app').onSnapshot(d=>{appSettings=d.exists?Object.assign({},d.data()):{};renderAll()},()=>{});
  db.collection('inspo').onSnapshot(s=>{inspo=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(view==='inspo')renderAll()},()=>{});
  db.collection('videos').onSnapshot(s=>{videos=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));vidLoaded=true;renderAll()},onErr);
})();
})();
</script>
</body></html>
